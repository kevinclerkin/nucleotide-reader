name: Release nucleotide reader API

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0"
        required: true
        type: string

      commit:
        description: "Commit SHA that passed the snapshot workflow"
        required: true
        type: string

permissions:
  contents: write

env:
  DOCKER_IMAGE: kc130/nucleotide-reader

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            echo "Expected format: 1.2.3"
            exit 1
          fi

      - name: Checkout snapshot commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0

      - name: Check current version
        run: |
          grep '^version = ' pyproject.toml

      - name: Check Docker snapshot exists
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          docker manifest inspect \
            "${{ env.DOCKER_IMAGE }}:${COMMIT}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull snapshot image
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          docker pull "${{ env.DOCKER_IMAGE }}:${COMMIT}"

      - name: Update pyproject.toml
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i -E \
            "s/^version = \".*\"/version = \"$VERSION\"/" \
            pyproject.toml

      - name: Verify version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          grep "version = \"$VERSION\"" pyproject.toml

      - name: Check release tag does not already exist
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists"
            exit 1
          fi

      - name: Commit version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add pyproject.toml
          git commit -m "Release $VERSION"

      - name: Create release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag "v$VERSION"

      - name: Push release commit and tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git push origin HEAD
          git push origin "v$VERSION"

      - name: Tag Docker image
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          docker tag \
            "${{ env.DOCKER_IMAGE }}:${COMMIT}" \
            "${{ env.DOCKER_IMAGE }}:${VERSION}"

      - name: Push release Docker image
        env:
          VERSION: ${{ inputs.version }}
        run: |
          docker push \
            "${{ env.DOCKER_IMAGE }}:${VERSION}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes
